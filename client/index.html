    <title>SocioSolve | PS26043 — Bridging Citizens, Universities & Industry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before React mounts, so the correct theme applies on the
      // very first paint instead of flashing dark then switching to
      // light (or vice versa). Reads the same localStorage key the
      // theme slice writes to.
      (function () {
        try {
          var mode = localStorage.getItem('themeMode') || 'dark';
          var resolved = mode;
          if (mode === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (resolved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          // localStorage unavailable (e.g. privacy mode) — fall back to dark, no-op.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
